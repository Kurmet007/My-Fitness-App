{% extends "base.html" %}
{% block content %}
<h3>Login</h3>

{% if error %}
<div class="alert alert-danger">
    {{ error }}
</div>
{% endif %}

<form method="post">
  {% csrf_token %}
  <input
    name="username"
    class="form-control mb-2"
    placeholder="Username"
    required
  >
  <input
    name="password"
    type="password"
    class="form-control mb-2"
    placeholder="Password"
    required
  >
  <button class="btn btn-primary w-100">Login</button>
</form>

<div class="mt-2 text-center">
    <a href="/signup/">Create account</a>
</div>
{% endblock %}
