{% extends "base.html" %}
{% block content %}
<h3>Add Exercise to {{ workout.name }}</h3>

    <input name="calories" type="number" class="form-control mb-2" placeholder="reps">
    <input name="calories" type="number" class="form-control mb-2" placeholder="sets">
    <button class="btn btn-success">Save</button>
</form>
{% endblock %}
